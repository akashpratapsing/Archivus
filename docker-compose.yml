version: '3.8'

services:
  # 1. Vector Database: Chroma
  chroma:
    image: chromadb/chroma:latest
    container_name: rag_chroma
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. RAG Backend: FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"
    depends_on:
      chroma:
        condition: service_healthy
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_GENERATION_MODEL=${GEMINI_GENERATION_MODEL:-gemini-3.8-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      - GROQ_GENERATION_MODEL=${GROQ_GENERATION_MODEL:-llama-3.3-70b-versatile}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    restart: unless-stopped

  # 3. Frontend: React + Vite (served via Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
